<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>רכישות כדאיות</title>
<meta name="description" content="רכישות כדאיות – קהילה של קונים טובים שמתחברת ישירות לחקלאים וליצרנים מקומיים. כל הספקים של השבוע ורשימת קניות משותפת.">
<meta property="og:title" content="רכישות כדאיות – כי באנו לעשות טוב">
<meta property="og:description" content="כל הספקים של השבוע, מועדי סגירה, תשלום ורשימת קניות משותפת.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Secular+One&family=Assistant:wght@400;600;700&display=swap">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style id="rk-style">
/* Layout: the logo's market cart — striped awning on top, sky header with clouds and green hills, then supplier "stalls" with little awnings, and the shopping list at the bottom */
:root{
  --bg:#F2F8F6; --surface:#FFFFFF; --ink:#173436; --muted:#4F6B6C; --line:#D3E4E2;
  --leaf:#16868C; --leaf-deep:#126F74; --leaf-soft:#DDF0EF; --heart:#E9474A; --heart-soft:#FDE6E5; --sun:#D9912A;
  --sky:#CDEBF8; --sky-2:#EEF8FC; --cloud:#FFFFFF; --grass:#86A023; --grass-2:#B8D06A;
  --band:#126F74; --band-ink:#FFFFFF;
  --hand:"Amatic SC","Secular One","Assistant",system-ui,sans-serif;
  --display:"Secular One","Assistant",system-ui,sans-serif;
  --body:"Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --c-veg:#5E8A12; --c-dairy:#16868C; --c-meat:#C9393B; --c-bake:#C07E1A; --c-cooked:#8A5A9E; --c-sweet:#D9477A; --c-pantry:#8C6B2E; --c-well:#5B5BB0;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1C1E; --surface:#152829; --ink:#E5F2F1; --muted:#9BB7B7; --line:#26403F;
  --leaf:#4CC3C8; --leaf-deep:#2E9EA3; --leaf-soft:#173A3B; --heart:#FF6B6B; --heart-soft:#3B1F21; --sun:#F0B455;
  --sky:#18414C; --sky-2:#10282E; --cloud:#2B5560; --grass:#4F6C14; --grass-2:#3A5310;
  --band:#0F4A4E; --band-ink:#EAF8F7;
  --c-veg:#A6CC54; --c-dairy:#5FCBD0; --c-meat:#FF7C7C; --c-bake:#EDB45A; --c-cooked:#C79BDA; --c-sweet:#F28DB0; --c-pantry:#D5B676; --c-well:#A9A9F0;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1C1E; --surface:#152829; --ink:#E5F2F1; --muted:#9BB7B7; --line:#26403F;
  --leaf:#4CC3C8; --leaf-deep:#2E9EA3; --leaf-soft:#173A3B; --heart:#FF6B6B; --heart-soft:#3B1F21; --sun:#F0B455;
  --sky:#18414C; --sky-2:#10282E; --cloud:#2B5560; --grass:#4F6C14; --grass-2:#3A5310;
  --band:#0F4A4E; --band-ink:#EAF8F7;
  --c-veg:#A6CC54; --c-dairy:#5FCBD0; --c-meat:#FF7C7C; --c-bake:#EDB45A; --c-cooked:#C79BDA; --c-sweet:#F28DB0; --c-pantry:#D5B676; --c-well:#A9A9F0;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;direction:rtl}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}

/* awning */
.awning{height:46px;background:repeating-linear-gradient(90deg,var(--leaf) 0 56px,var(--heart) 56px 112px);
  -webkit-mask:radial-gradient(28px 18px at 28px 28px,#000 98%,transparent) 0 0/56px 100% repeat-x,linear-gradient(#000,#000) 0 0/100% 28px no-repeat;
          mask:radial-gradient(28px 18px at 28px 28px,#000 98%,transparent) 0 0/56px 100% repeat-x,linear-gradient(#000,#000) 0 0/100% 28px no-repeat;
  position:relative;z-index:2}
.card{position:relative;overflow:hidden;padding-top:30px!important;grid-template-columns:minmax(0,1fr)}
.top>div{min-width:0}
.mini-awning{position:absolute;inset:0 0 auto 0;height:20px;background:repeating-linear-gradient(90deg,var(--cc) 0 22px,color-mix(in srgb,var(--cc) 28%,var(--surface)) 22px 44px);
  -webkit-mask:radial-gradient(11px 8px at 11px 12px,#000 98%,transparent) 0 0/22px 100% repeat-x,linear-gradient(#000,#000) 0 0/100% 12px no-repeat;
          mask:radial-gradient(11px 8px at 11px 12px,#000 98%,transparent) 0 0/22px 100% repeat-x,linear-gradient(#000,#000) 0 0/100% 12px no-repeat}
[hidden]{display:none!important}

/* header: sky, clouds, hills */
.band{position:relative;background:linear-gradient(var(--sky),var(--sky-2));color:var(--ink);margin-top:-28px;padding-top:28px;overflow:hidden}
.band::before,.band::after{content:"";position:absolute;background:var(--cloud);border-radius:999px;opacity:.95;pointer-events:none}
.band::before{width:150px;height:46px;top:70px;left:6%;box-shadow:34px -22px 0 4px var(--cloud),78px -6px 0 0 var(--cloud)}
.band::after{width:110px;height:34px;top:62px;left:46%;box-shadow:26px -16px 0 2px var(--cloud);opacity:.75}
.band .wrap{position:relative;z-index:1;padding-block:22px 0;display:grid;gap:20px}
.brand{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:center}
.logo{width:132px;height:132px;border-radius:50%;box-shadow:0 6px 0 var(--leaf-deep),0 12px 26px rgba(18,111,116,.25);background:var(--cloud)}
.eyebrow{font-size:13px;letter-spacing:.06em;color:var(--leaf-deep);font-weight:700}
.brand h1{font-family:var(--hand);font-weight:700;font-size:clamp(46px,8vw,72px);line-height:.95;color:var(--sun);letter-spacing:.01em}
.slogans{display:grid;justify-items:start;gap:6px;margin-top:8px}
.tag{display:inline-block;background:var(--leaf-deep);color:var(--band-ink);font-weight:700;padding:5px 16px;font-size:clamp(17px,2.4vw,21px);border-radius:4px}
.tag2{font-family:var(--hand);font-weight:700;font-size:clamp(30px,4.6vw,40px);line-height:1;color:var(--heart)}
.f-sl{font-weight:700;color:var(--leaf-deep)}
.brand p{margin:8px 0 0;color:var(--muted);max-width:52ch;font-size:15px}
.counters{display:grid;gap:8px}
.counter{text-decoration:none;background:var(--surface);border:2px solid var(--leaf);border-radius:14px;padding:8px 14px;text-align:right;min-width:160px;color:var(--ink)}
.counter b{font-family:var(--display);font-size:24px;font-weight:400;display:block;line-height:1;color:var(--leaf);font-variant-numeric:tabular-nums}
.counter span{font-size:13px;color:var(--muted)}
.counter[aria-pressed="true"]{background:var(--leaf);color:var(--band-ink)}
.counter[aria-pressed="true"] b,.counter[aria-pressed="true"] span{color:var(--band-ink)}
@media (max-width:760px){.brand{grid-template-columns:auto minmax(0,1fr)}.counters{grid-column:1/-1;grid-template-columns:1fr 1fr}.counter{min-width:0}.logo{width:96px;height:96px}}
.next{position:relative;z-index:1;display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;background:var(--band);color:var(--band-ink);border-radius:16px;padding:14px 16px;box-shadow:0 8px 20px rgba(18,111,116,.18)}
.date{font-family:var(--display);text-align:center;line-height:1;background:var(--band-ink);color:var(--band);border-radius:12px;padding:10px 12px;min-width:74px;border-top:6px solid var(--heart)}
.date small{display:block;font-family:var(--body);font-size:12px;font-weight:700;margin-bottom:4px}
.date b{font-size:28px;font-weight:400;font-variant-numeric:tabular-nums}
.next h2{font-size:20px}
.next p{margin:2px 0 0;font-size:14px;opacity:.9}
.btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:700;border-radius:999px;padding:9px 16px;border:0;white-space:nowrap}
.btn-light{background:var(--sun);color:#fff}
@media (max-width:620px){.next{grid-template-columns:auto 1fr}.next .btn{grid-column:1/-1;justify-content:center}}
.hills{display:block;width:100%;height:70px;margin-top:-34px;position:relative;z-index:0}
.hills .h1{fill:var(--grass-2)}.hills .h2{fill:var(--grass)}
.ground{height:10px;background:var(--grass)}
.top-road{position:relative;z-index:1}
.hero-lane{position:relative;z-index:2;height:118px;pointer-events:none}
.hero-mover{position:absolute;bottom:-6px;right:6%;width:150px}
.hills{position:relative;z-index:1;margin-top:0!important}
.hero-road{height:22px;background:var(--grass);position:relative;box-shadow:0 -8px 0 var(--grass-2)}
.hero-road::after{content:"";position:absolute;inset:11px 0 auto 0;height:4px;background:repeating-linear-gradient(90deg,var(--surface) 0 26px,transparent 26px 52px);opacity:.85}
@media (max-width:620px){.hero-mover{width:120px}.hero-lane{height:96px}}
@media (prefers-reduced-motion:no-preference){.hero-mover{animation:roll2 12s ease-in-out infinite alternate}}
@keyframes roll2{from{right:3%}to{right:calc(97% - 150px)}}
@media (max-width:620px){@keyframes roll2{from{right:3%}to{right:calc(97% - 120px)}}}



/* story: market on wheels */
.story{margin-top:26px;display:grid;gap:18px}
.story-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px;align-items:center}
@media (max-width:820px){.story-top{grid-template-columns:1fr}}
.kicker{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--heart)}
.story h2{font-family:var(--hand);font-weight:700;font-size:clamp(46px,7vw,64px);color:var(--leaf-deep);line-height:1}
.story-txt p{margin:10px 0 0;font-size:16.5px;max-width:58ch}
.story-txt .quote{border-inline-start:4px solid var(--sun);padding-inline-start:12px;color:var(--muted);font-size:15px}
.road{background:linear-gradient(var(--sky-2),var(--sky));border-radius:20px;padding:16px 16px 0;overflow:hidden;position:relative}
.stops{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;font-weight:700;font-size:13.5px;color:var(--leaf-deep)}
.stops span{background:var(--surface);border-radius:999px;padding:3px 10px;border:1px solid var(--line)}
.stops .end{background:var(--heart);color:#fff;border-color:var(--heart)}
.lane{position:relative;height:160px;margin-top:8px;border-bottom:22px solid var(--grass);background:linear-gradient(transparent 128px,var(--grass-2) 128px)}
.lane::after{content:"";position:absolute;inset:auto 0 -13px 0;height:4px;background:repeating-linear-gradient(90deg,var(--surface) 0 22px,transparent 22px 44px);opacity:.8}
.mover{position:absolute;bottom:-2px;right:8%;width:190px}
.cart{width:100%;height:auto;display:block}
@media (prefers-reduced-motion:no-preference){
  .mover{animation:roll 9s ease-in-out infinite alternate}
  .wheel{animation:spin 1.6s linear infinite}
}
@keyframes roll{from{right:2%}to{right:calc(98% - 190px)}}
@keyframes spin{to{transform:rotate(-360deg)}}
.chain{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;counter-reset:c}
@media (max-width:760px){.chain{grid-template-columns:1fr}}
.chain li{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px 14px 40px;position:relative;display:grid;gap:2px}
.chain li b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--leaf-deep)}
.chain li span{font-size:14px;color:var(--muted)}
.chain li:not(:last-child)::after{content:"⬅";position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--heart);font-size:18px}
.chain li:last-child::after{content:"♥";position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--heart);font-size:20px}
@media (max-width:760px){.chain li:not(:last-child)::after{content:"⬇"}}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;background:var(--band);color:var(--band-ink);border-radius:18px;padding:16px}
@media (max-width:620px){.facts{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:16px}}
.facts div{display:grid;justify-items:center;text-align:center}
.facts b{font-family:var(--hand);font-weight:700;font-size:56px;line-height:.9;color:var(--sun);font-variant-numeric:tabular-nums}
.facts span{font-size:14px;font-weight:600}
.faces{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.faces h3{font-family:var(--hand);font-weight:700;font-size:34px;color:var(--sun);line-height:1;margin-bottom:8px}
.faces ul{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:8px 18px}
.faces li{font-size:14.5px;color:var(--muted);padding-inline-start:18px;position:relative}
.faces li::before{content:"♥";position:absolute;inset-inline-start:0;color:var(--heart);font-size:12px;top:3px}
.faces li b{color:var(--ink)}


/* card facts + countdown */
.rows{display:grid;gap:6px;margin:0;padding:10px 12px;background:var(--bg);border-radius:12px;font-size:14px}
.rows div{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:baseline}
.rows dt{color:var(--muted);font-weight:600;min-width:58px}
.rows dd{margin:0;font-weight:700}
.cd{font-variant-numeric:tabular-nums;display:inline-block;border-radius:999px;padding:1px 9px;font-size:13px;background:var(--leaf-soft);color:var(--leaf-deep);margin-inline-start:4px}
.cd.soon{background:var(--heart-soft);color:var(--heart)}
.cd.over{background:var(--line);color:var(--muted)}
.ks{color:var(--grass)}
.paylink{display:inline-flex;align-items:center;gap:4px;background:var(--heart);color:#fff;text-decoration:none;border-radius:999px;padding:3px 12px;font-size:13.5px}
.paylink:hover{filter:brightness(1.08)}
.sortsel{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 12px}

/* list */
.howto{display:grid;grid-template-columns:auto 1fr auto;gap:6px 14px;align-items:center;margin-top:22px;background:var(--leaf-soft);border-radius:16px;padding:14px 16px;text-decoration:none}
.howto b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--leaf)}
.howto span{font-size:14.5px;color:var(--muted);min-width:0}
.howto em{font-style:normal;font-weight:700;color:var(--leaf);white-space:nowrap}
@media (max-width:620px){.howto{grid-template-columns:1fr}}
.addbtn{border:1px solid var(--leaf);color:var(--leaf);background:var(--surface);border-radius:999px;height:40px;padding:0 12px;font-weight:700;white-space:nowrap;flex:none}
.addbtn[aria-pressed="true"]{background:var(--leaf);color:var(--surface)}
.mylist{scroll-margin-top:16px;border-top:3px dashed var(--grass);padding-block:22px 34px}
.ml-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ml-head h2{font-family:var(--hand);font-weight:700;font-size:44px;color:var(--leaf-deep);line-height:1}
.ml-head p{margin:4px 0 0;color:var(--muted);font-size:14px;max-width:60ch}
.progress{font-weight:700;font-variant-numeric:tabular-nums;background:var(--leaf-soft);color:var(--leaf);border-radius:999px;padding:6px 14px;font-size:14px}
.ml-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:14px}
@media (max-width:760px){.ml-grid{grid-template-columns:1fr}}
.ml-box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px;align-content:start;min-width:0}
.ml-box h3{font-size:18px}
.field{display:grid;gap:4px;font-size:13.5px;font-weight:600;color:var(--muted)}
.field input,.field select{font:inherit;font-weight:400;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#pick-fields,#cour-fields{display:grid;gap:10px}
#pick-fields[hidden],#cour-fields[hidden]{display:none}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg label{display:flex;justify-content:center;align-items:center;gap:6px;padding:8px;border-radius:9px;font-weight:700;font-size:14px;cursor:pointer}
.seg input{accent-color:var(--leaf)}
.seg label:has(input:checked){background:var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.hint{margin:0;font-size:13px;color:var(--muted)}
.items{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.item.got{background:var(--leaf-soft);border-color:transparent}
.item.got .iname{text-decoration:line-through;color:var(--muted)}
.item input[type=checkbox]{width:22px;height:22px;accent-color:var(--leaf);grid-row:1/3}
.iname{font-weight:700}
.item input[type=text]{grid-column:2/4;font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:6px 9px;min-width:0}
.rm{background:none;border:0;color:var(--muted);font-size:20px;line-height:1;padding:2px 6px}
.items .none{border:1px dashed var(--line);border-radius:14px;padding:22px 14px;text-align:center;color:var(--muted);font-size:14.5px}
.ml-actions{display:flex;gap:8px;flex-wrap:wrap}
.ml-actions .go{flex:1 1 100%}
.btn.alt{background:var(--leaf-soft);color:var(--leaf)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--muted)}
.btn.ghost.warn{border-color:var(--heart);color:var(--heart)}
.floatbar{position:fixed;inset:auto 0 0 0;z-index:8;display:flex;justify-content:space-between;align-items:center;gap:10px;text-decoration:none;background:var(--leaf-deep);color:var(--band-ink);border-top:4px solid var(--heart);font-size:15px;padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.has-list footer .wrap{padding-bottom:80px}

/* info */
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;padding-block:22px 6px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.note h3{font-size:16px;margin-bottom:4px;color:var(--leaf-deep)}
.note{border-top:4px solid var(--grass)!important}
.note p{margin:0;font-size:14.5px;color:var(--muted)}
.note .phone{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;user-select:all}

/* toolbar */
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding-block:22px 10px}
.section-head h2{font-family:var(--hand);font-weight:700;font-size:44px;color:var(--leaf-deep);line-height:1}
.section-head p{margin:0;color:var(--muted);font-size:14px}
.tools{display:grid;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.searchrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 240px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 14px}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;padding:10px 0;outline:none}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);user-select:none}
.toggle input{accent-color:var(--leaf);width:18px;height:18px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--dot,var(--leaf));display:inline-block}
.chip[aria-pressed="true"]{background:var(--leaf);color:var(--band-ink);border-color:var(--leaf)}
.viewbar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--leaf-soft);border-radius:12px;padding:8px 12px;font-size:14px}
.linkbtn{background:none;border:0;text-decoration:underline;padding:0;font-weight:600}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;padding-block:6px 28px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;grid-template-rows:auto auto 1fr auto;gap:12px;min-width:0;box-shadow:0 3px 0 var(--line)}
.card.closed{opacity:.72}
.top{display:flex;gap:12px;align-items:flex-start}
.mark{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:22px;color:var(--surface);background:var(--cc)}
.top h3{font-size:19px;line-height:1.2}
.cat{font-size:12.5px;font-weight:700;color:var(--cc);letter-spacing:.02em}
.desc{margin:0;font-size:14.5px;color:var(--muted)}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.badge{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;border:1px solid var(--line);color:var(--muted)}
.badge.open{color:var(--leaf);border-color:var(--leaf)}
.badge.form{color:var(--c-dairy);border-color:var(--c-dairy)}
.badge.fri{color:var(--sun);border-color:var(--sun)}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.actions .go{flex:1 1 100%}
.actions .addbtn{flex:1}
.go{flex:1;justify-content:center;background:var(--leaf);color:var(--surface)}
.card.closed .go{background:var(--line);color:var(--ink)}
.icon{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.icon svg{width:20px;height:20px}
.fav[aria-pressed="true"]{background:var(--heart-soft);border-color:var(--heart);color:var(--heart)}
.fav[aria-pressed="true"] svg path{fill:var(--heart)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 16px;border:1px dashed var(--line);border-radius:18px}

footer{border-top:10px solid var(--grass);background:var(--surface)}
footer .wrap{padding-block:22px 30px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:14px}
footer b{font-family:var(--hand);font-weight:700;color:var(--sun);font-size:30px}
.flinks{display:flex;gap:14px;flex-wrap:wrap}
.flinks a{font-weight:600;color:var(--leaf)}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s ease,box-shadow .15s ease}.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.07)}}


.goals{background:var(--heart-soft);border-radius:18px;padding:16px 18px}
.goals h3{font-family:var(--hand);font-weight:700;font-size:38px;color:var(--heart);line-height:1;margin-bottom:10px}
.goals ul{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px 20px}
.goals li{position:relative;padding-inline-start:26px;font-size:15.5px;font-weight:600;color:var(--ink)}
.goals li::before{content:"♥";position:absolute;inset-inline-start:0;top:0;color:var(--heart);font-size:18px}


.spread{display:inline-flex;align-items:center;gap:8px;margin:8px 0 0!important;background:var(--heart);color:#fff;font-weight:700;font-size:17px!important;border-radius:999px;padding:4px 16px}
.spread::before{content:"♥"}
.road-cap{margin:0 -16px;padding:12px 16px 14px;background:var(--grass);color:#fff;font-size:15px;line-height:1.5}
.road-cap b{display:block;font-family:var(--hand);font-size:28px;line-height:1.05;font-weight:700}
.lane{border-bottom-width:14px!important}

/* posts */
.posts{margin-top:30px;display:grid;gap:14px}
.post-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.post{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:grid;align-content:start}
.post img{width:100%;aspect-ratio:4/3;object-fit:cover;max-width:100%}
.post-body{padding:14px 16px;display:grid;gap:6px}
.post h3{font-size:18px;color:var(--leaf-deep)}
.post p{margin:0;font-size:15px;color:var(--ink)}
.post .who{font-weight:700;color:var(--heart);font-size:14px}
.post-news{border-top:5px solid var(--heart)}
.post-reviews{background:var(--heart-soft);border-color:transparent}
.post-reviews p::before{content:"“";font-family:var(--display);font-size:30px;line-height:0;color:var(--heart);vertical-align:-10px;margin-inline-end:4px}
.post-perks{border:2px dashed var(--sun)}
#sec-news{margin-top:26px}
/* galleries */
.gal,.collab{margin-top:30px;display:grid;gap:14px}
.gal-head h2{font-family:var(--hand);font-weight:700;font-size:clamp(40px,6vw,52px);color:var(--leaf-deep);line-height:1}
.gal-head p{margin:4px 0 0;color:var(--muted);font-size:15px}
.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gal-item{position:relative;padding:0;border:0;border-radius:16px;overflow:hidden;aspect-ratio:1;max-width:100%;background:var(--leaf-soft);cursor:zoom-in}
.gal-item img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s ease}
.gal-item:hover img{transform:scale(1.04)}
.gal-item span{position:absolute;inset:auto 0 0 0;padding:18px 10px 8px;font-size:13px;font-weight:700;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.6));text-align:right}
.gal-empty{grid-column:1/-1;margin:0;padding:22px;border:2px dashed var(--line);border-radius:16px;color:var(--muted);text-align:center}
.lb{position:fixed;inset:0;z-index:60;background:rgba(8,20,22,.92);display:grid;place-items:center;padding:calc(50px + env(safe-area-inset-top,0px)) 56px calc(30px + env(safe-area-inset-bottom,0px))}
.lb figure{margin:0;display:grid;gap:10px;justify-items:center;max-width:100%}
.lb img{max-width:100%;max-height:78vh;border-radius:12px;object-fit:contain}
.lb figcaption{color:#fff;font-weight:600;text-align:center}
.lb-x,.lb-nav{position:absolute;background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:50%;width:44px;height:44px;font-size:28px;line-height:1;display:grid;place-items:center}
.lb-x{top:calc(10px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px))}
.lb-prev{right:calc(8px + env(safe-area-inset-right,0px));top:50%}
.lb-next{left:calc(8px + env(safe-area-inset-left,0px));top:50%}
.collab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.co-card{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.co-card img,.co-mark{width:72px;height:72px;border-radius:14px;object-fit:cover}
.co-mark{display:grid;place-items:center;background:var(--sun);color:#fff;font-family:var(--display);font-size:30px}
.co-card h3{font-size:17px;color:var(--leaf-deep)}
.co-card p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.co-link{display:inline-block;margin-top:6px;font-weight:700;color:var(--heart);text-decoration:none}
.collab-cta{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;background:var(--sky);border-radius:18px;padding:16px 18px;border:2px dashed var(--leaf)}
.collab-cta>div{display:grid;gap:4px;flex:1 1 280px;min-width:0}
.collab-cta b{font-family:var(--display);font-weight:400;font-size:19px;color:var(--leaf-deep)}
.collab-cta span{font-size:14.5px;color:var(--muted)}
.collab-cta .phone{font-weight:700;color:var(--ink);user-select:all}
.collab-cta .btn{flex:0 0 auto}
.upl{justify-self:start;cursor:pointer}
.ed-thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ed-th{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:6px}
.ed-th img{grid-column:1/-1;width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:var(--leaf-soft)}
.ed-th input{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 7px;min-width:0}
.ed-co{display:grid;grid-template-columns:110px 1fr 1.4fr 1.2fr auto;gap:8px;align-items:end;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;background:var(--bg)}
.ed-co-img{display:grid;gap:4px;justify-items:center;font-size:12px;color:var(--muted)}
.ed-co-img img{width:72px;height:72px;object-fit:cover;border-radius:10px}
@media (max-width:760px){.ed-co{grid-template-columns:1fr auto}.ed-co .field,.ed-co-img{grid-column:1/2}}
/* Vered */
.vered{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:center;margin:16px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px}
.vered img{width:150px;height:150px;object-fit:cover;object-position:62% 35%;border-radius:50%;border:5px solid var(--heart);box-shadow:0 6px 16px rgba(0,0,0,.12)}
.vered figcaption{display:grid;gap:6px}
.vered b{font-family:var(--hand);font-weight:700;font-size:34px;line-height:1;color:var(--heart)}
.vered span{font-size:15px;color:var(--muted)}
.vered em{font-style:normal;font-weight:700;color:var(--leaf-deep)}
@media (max-width:480px){.vered{grid-template-columns:1fr;justify-items:center;text-align:center}.vered img{width:170px;height:170px}}
.pts p{margin:2px 0 0;font-size:14px;opacity:.95}
/* editor */
.edbtn{display:block;margin-bottom:8px;background:var(--sun);color:#fff;border:0;border-radius:999px;padding:6px 14px;font-weight:700}
.ed{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))}
.ed-bar{position:sticky;top:0;z-index:2;background:var(--band);color:var(--band-ink);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ed-bar h2{font-size:20px}
.ed-acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ed-acts .btn.ghost{color:var(--band-ink);border-color:rgba(255,255,255,.5)}
.ed-acts .go{background:var(--sun);color:#fff}
.ed-msg{font-size:14px;font-weight:600}
.ed-body{display:grid;gap:18px;padding-block:18px}
.ed-sec{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px}
.ed-sec h3{font-size:19px;color:var(--leaf-deep)}
.ed-sechead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ed-pt{display:grid;grid-template-columns:1fr 1fr 1.6fr auto;gap:8px;align-items:end}
@media (max-width:620px){.ed-pt{grid-template-columns:1fr 1fr auto}.ed-pt label:nth-child(3){grid-column:1/3}}
.ed-sup{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--bg)}
.ed-sup summary{display:flex;gap:10px;align-items:center;padding:10px 12px;cursor:pointer;flex-wrap:wrap}
.ed-sup .dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
.ed-sup .dot.on{background:var(--grass)}
.ed-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:4px 12px 14px}
.ed-grid .wide{grid-column:1/-1}
.ed-grid textarea{font:inherit;font-weight:400;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;resize:vertical}
.ed-grid .field input,.ed-grid .field select{background:var(--surface)}
@media (max-width:620px){.ed-grid{grid-template-columns:1fr}}
.chk{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.chk input{width:18px;height:18px;accent-color:var(--leaf)}
.ed-del{display:flex;justify-content:flex-end}
.btn.warn,.btn.ghost.warn{border-color:var(--heart);color:var(--heart)}

/* ---- added for the GitHub Pages version ---- */
.item .ipay{grid-column:2/4;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:13.5px;color:var(--muted)}
.item .ipay b{color:var(--ink);font-weight:600}
.item .ipay .paylink{font-weight:700}
.item .ipay .storelink{color:var(--leaf-deep);font-weight:700;text-decoration:none}
.syncline{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin:0}
.syncline i{width:9px;height:9px;border-radius:50%;background:var(--line);display:inline-block}
.syncline.ok i{background:var(--grass)}
.syncline.busy i{background:var(--sun)}
.syncline.err i{background:var(--heart)}
.sharebox{background:var(--leaf-soft);border-radius:14px;padding:12px 14px;display:grid;gap:8px}
.sharebox b{color:var(--leaf-deep)}
.sharebox p{margin:0;font-size:14px;color:var(--muted)}
.sharebox .row{display:flex;gap:8px;flex-wrap:wrap}
.paysum{border-top:1px dashed var(--line);padding-top:10px;display:grid;gap:6px}
.paysum h4{margin:0;font-size:15px;font-family:var(--display);font-weight:400;color:var(--leaf-deep)}
.paysum ul{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:14px}
.paysum li{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}

.fri-sec{border-top:3px dashed var(--sun);margin-top:6px}
.fri-sec .section-head h2{color:var(--sun)}
.fri-sec .section-head p{margin:0;color:var(--muted);max-width:60ch}
.fri-tag{display:inline-block;font-size:12px;font-weight:700;color:var(--sun);border:1px solid var(--sun);border-radius:999px;padding:0 8px;margin-inline-start:6px;vertical-align:middle}

.post.pc-blue{background:#E3ECFD;border-color:#BFD2F7;border-top:6px solid #5B7FE0}
.post.pc-red{background:#FCE3E1;border-color:#F4C1BD;border-top:6px solid #E0675F}
.post.pc-green{background:#E0F4DC;border-color:#BFE3B7;border-top:6px solid #5FB34E}
.post.pc-lime{background:#F0F6D2;border-color:#DCE8A4;border-top:6px solid #9DBB2E}
.post[class*="pc-"] h3{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .post[class*="pc-"]{background:var(--surface)}}

.contact{padding-block:10px 6px}
.contact-card{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--heart);border-radius:20px;padding:20px}
@media (max-width:760px){.contact-card{grid-template-columns:1fr}}
.contact h2{font-family:var(--hand);font-weight:700;font-size:clamp(40px,6vw,54px);color:var(--leaf-deep);line-height:1}
.contact-txt p{margin:10px 0 0;font-size:15.5px;max-width:62ch}
.contact-side{display:grid;gap:10px;align-content:start}

.contact-rules b{color:var(--leaf-deep);font-family:var(--display);font-weight:400;font-size:17px}
.contact-rules span{font-size:14.5px;color:var(--ink)}
.contact-side .btn{justify-content:center}
.contact-join{margin-top:12px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--heart-soft);border-radius:16px;padding:14px 16px}
.contact-join div{display:grid;gap:2px;min-width:0;flex:1 1 280px}
.contact-join b{color:var(--heart);font-family:var(--display);font-weight:400;font-size:18px}
.contact-join span{font-size:14px;color:var(--muted)}

.rows:not(:has(div)){display:none}
.badge.kosher{color:#1F6FB2;border-color:#1F6FB2}
.badge.kosher-home{color:#6A5BB0;border-color:#6A5BB0}
.more{font-size:14px;color:var(--muted);margin-top:-4px}
.more summary{cursor:pointer;font-weight:700;color:var(--leaf-deep);list-style:none;display:inline-flex;align-items:center;gap:4px}
.more summary::-webkit-details-marker{display:none}
.more summary::after{content:"▾";font-size:12px;transition:transform .15s}
.more[open] summary::after{transform:rotate(180deg)}
.more p{margin:6px 0 0;line-height:1.6}

.card .cover{display:block;width:auto;max-width:none;justify-self:stretch;margin:-10px -16px 0;height:150px;object-fit:cover;background:var(--leaf-soft)}
.card.closed .cover{filter:grayscale(.6);opacity:.75}
.logo-mark{object-fit:cover;background:var(--surface);border:2px solid var(--cc);padding:0}

.story-head{position:relative;z-index:1;margin-top:0;padding-top:22px;padding-bottom:6px}
.story-head .vered{background:var(--surface)}

.share{margin-top:22px}
.share-in{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;background:var(--heart-soft);border-radius:18px;padding:16px 18px}
.share-in>div:first-child{flex:1 1 300px;min-width:0}
.share h2{font-family:var(--hand);font-weight:700;font-size:40px;color:var(--heart);line-height:1}
.share p{margin:6px 0 0;color:var(--muted);font-size:15px}
.share-btns{display:flex;flex-wrap:wrap;gap:8px}
.sub{position:fixed;inset:0;z-index:60;background:rgba(10,30,30,.55);display:grid;place-items:center;padding:16px}
.sub-box{background:var(--surface);border-radius:20px;padding:18px;width:min(520px,100%);max-height:92vh;overflow:auto;display:grid;gap:10px}
.sub-top{display:flex;justify-content:space-between;align-items:center}
.sub-top h2{font-family:var(--display);font-weight:400;font-size:22px;color:var(--leaf-deep)}
.sub .lb-x{position:static;background:var(--bg);color:var(--ink);width:36px;height:36px;border-radius:50%;border:0;font-size:22px}
.sub textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg3 label{display:flex;justify-content:center;align-items:center;gap:4px;padding:8px 4px;border-radius:9px;font-weight:700;font-size:14px;cursor:pointer}
.seg3 input{position:absolute;opacity:0;pointer-events:none}
.seg3 label:has(input:checked){background:var(--leaf);color:#fff}
.ed-subi{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px}
.ed-subi:not(:has(img)){grid-template-columns:1fr}
.ed-subi img{width:96px;height:96px;object-fit:cover;border-radius:10px}
.ed-subi p{margin:4px 0;font-size:14px;color:var(--muted)}
.ed-subact{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}

main [data-tab]:not(.tab-on){display:none!important}
.tabs{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);margin-top:6px}
.tabs-in{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:8px}
.tabs-in::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14.5px;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--leaf);border-color:var(--leaf);color:#fff}
.tabs button b{display:inline-block;min-width:20px;padding:0 6px;margin-inline-start:4px;border-radius:999px;background:var(--heart);color:#fff;font-size:12px}
main>[data-tab].tab-on:first-of-type{margin-top:18px}
.tel{color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:2px;unicode-bidi:isolate}
</style>

<body>
<div id="rk-root"></div>
<script type="text/html" id="rk-body"><div class="awning" aria-hidden="true"></div>
<header class="band">
  <div class="wrap story story-head">
    <div class="story-top">
      <div class="story-txt">
        <div class="kicker">איך זה עובד</div>
        <h2 id="story-h">היצרנים מגיעים עד אליכם</h2>
        <p class="spread">שוק נייד שמפיץ את הטוב</p>

          <figcaption><b>נעים מאוד, אני ורד</b><span>הקמתי את הקהילה בתקופת הקורונה כדי לעזור ולתמוך בחקלאים ובעסקים בישראל. כמנהלת הקהילה אני בודקת בקפידה את כל הספקים והתוצרת, ומבצעת פיקוח מחירים מלא, עם דגש על שירות ויחס אדיב מכל מי שנוגע במיזם. הכל צריך להיות הוגן לכל הצדדים.</span><em>כי באנו לעשות טוב ♥️</em></figcaption>

<script type="module" id="rk-app">import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

const ME0={name:"",phone:"",mode:"pickup",point:"",street:"",apt:"",floor:"",code:"",cnote:"",cphone:""};

  if(!id){id="c"+Math.random().toString(36).slice(2,9);try{localStorage.setItem("rcid4",id)}catch(e){}}return id}

// ---- saving to Firebase (debounced) ----
let saveT=null, lastSent="", fbReady=false;
function syncState(c,t){const el=$("sync");if(!el)return;el.className="syncline "+c;$("sync-t").textContent=t}

      .then(()=>{syncState("ok","נשמר ומסונכרן ✓");track()})
      .catch(()=>syncState("err","לא נשמר. בדקו את החיבור לאינטרנט"));
  },600);

    deliveryType:me.mode==="courier"?"courier":"self",

    lastSeen:new Date().toLocaleDateString("he-IL"),
    lastSeenTime:new Date().toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"}),id:CID}).catch(()=>{});
}


// ---- closing times (Israel time) ----
const TZ="Asia/Jerusalem";
const DAYN=["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];
function tzOff(ms){const t=new Intl.DateTimeFormat("en-US",{timeZone:TZ,timeZoneName:"shortOffset"}).formatToParts(new Date(ms)).find(p=>p.type==="timeZoneName").value;const m=t.match(/GMT([+-]\d+)(?::(\d+))?/);return m?(+m[1])*60+(m[1][0]==="-"?-1:1)*(+(m[2]||0)):120}
function ilDate(y,mo,d,h,mi){const g=Date.UTC(y,mo,d,h,mi);return g-tzOff(g)*60000}
function ilParts(ms){const o={};new Intl.DateTimeFormat("en-US",{timeZone:TZ,year:"numeric",month:"numeric",day:"numeric",weekday:"short",hour:"numeric",hour12:false}).formatToParts(new Date(ms)).forEach(p=>o[p.type]=p.value);return{y:+o.year,mo:+o.month-1,d:+o.day,wd:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(o.weekday)}}
let DIST=null;
function computeTimes(){
  const now=Date.now(), p=ilParts(now);
  let add=(3-p.wd+7)%7, wed=ilDate(p.y,p.mo,p.d+add,21,0);
  if(wed<=now){add+=7}
  DIST={y:p.y,mo:p.mo,d:p.d+add};
  const dd=new Date(Date.UTC(DIST.y,DIST.mo,DIST.d));
  $("dist-date").textContent=`${dd.getUTCDate()}.${dd.getUTCMonth()+1}`;
}
function closeAt(s){
  if(s.o&&/^\d{4}-\d{2}-\d{2}$/.test(s.ud||"")){const[y,m,d]=s.ud.split("-").map(Number),[h2,m2]=(s.ct||"23:59").split(":").map(Number);return ilDate(y,m-1,d,h2,m2||0)}
  if(!s.o||s.cd===null||s.cd===undefined||s.cd==="")return null;
  const [hh,mm]=(s.ct||"00:00").split(":").map(Number), off=(+s.cd)-3;
  if(s.f){const p=ilParts(Date.now());let add=((+s.cd)-p.wd+7)%7,t=ilDate(p.y,p.mo,p.d+add,hh,mm||0);if(t<=Date.now())t=ilDate(p.y,p.mo,p.d+add+7,hh,mm||0);return t}
  if(off>0){const t0=ilDate(DIST.y,DIST.mo,DIST.d-7+off,hh,mm||0);if(t0>Date.now())return t0}
  return ilDate(DIST.y,DIST.mo,DIST.d+off,hh,mm||0);
}
function isOpen(s){const t=closeAt(s);return !!t&&t>Date.now()}
function closeLabel(s){const t=closeAt(s);if(!t)return "";const p=ilParts(t);const f=new Intl.DateTimeFormat("he-IL",{timeZone:TZ,hour:"2-digit",minute:"2-digit"}).format(new Date(t));return `יום ${DAYN[p.wd]} ${p.d}.${p.mo+1} בשעה ${f}`}
function cdText(t){let ms=t-Date.now();if(ms<=0)return["הטופס נסגר","over"];const s=Math.floor(ms/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),sec=s%60;const pad=n=>String(n).padStart(2,"0");
  if(d>0)return[`נשארו ${d===1?"יום":d+" ימים"} ו-${h} שעות`,""];return[`נשארו ${pad(h)}:${pad(m)}:${pad(sec)}`,ms<3*3600e3?"soon":""]}
function tick(){let flip=false;document.querySelectorAll("[data-cd]").forEach(el=>{const s=byH[el.dataset.cd],t=closeAt(s);const[tx,c]=cdText(t);el.textContent=tx;el.className="cd "+c;if(c==="over"&&!el.closest(".card").classList.contains("closed"))flip=true});if(flip)renderGrid()}

function chips(){

      <label class="field">כשרות<select data-i="${i}" data-f="ks">${opt([["","לא מוצג"],["כשר","כשר"],["הקפדה על כשרות, ללא תעודה","הקפדה על כשרות, ללא תעודה"],["לא כשר","לא כשר"]],s.ks)}</select></label>
      <label class="field">מילות חיפוש<input data-i="${i}" data-f="k" value="${esc(s.k)}"></label>
      <label class="field wide">מידע נוסף (נפתח בלחיצה בכרטיס: סיפור, הוראות, כשרות, משלוח)<textarea data-i="${i}" data-f="more" rows="4">${esc(s.more||"")}</textarea></label>
      <div class="wide ed-del"><button class="btn ghost" type="button" data-del="${i}">מחיקת הספק</button></div>
    </div></details>`).join("")+'<datalist id="ed-pay"><option value="פייבוקס"><option value="ביט"><option value="אשראי בחנות"><option value="מזומן באיסוף"></datalist>';
}

function edThumbs(kind){
  $("ed-"+kind).innerHTML=(draft[kind]||[]).map((g,i)=>`<div class="ed-th"><img src="${blob(g.id)}" alt=""><input data-g="${kind}" data-gi="${i}" value="${esc(g.cap||"")}" placeholder="כיתוב (לא חובה)"><button class="rm" type="button" data-gdel="${kind}:${i}" aria-label="הסרת תמונה">×</button></div>`).join("")||'<p class="hint">עוד אין תמונות.</p>';
}
function edCollabs(){
  $("ed-collabs").innerHTML=(draft.collabs||[]).map((c,i)=>`<div class="ed-co">
    <div class="ed-co-img">${c.img?`<img src="${blob(c.img)}" alt="">`:'<span>אין תמונה</span>'}<label class="linkbtn" for="up-co-${i}">${c.img?"החלפת תמונה":"הוספת תמונה"}<input id="up-co-${i}" type="file" accept="image/*" data-coimg="${i}" hidden></label></div>
    <label class="field">שם<input data-co="${i}" data-f="n" value="${esc(c.n||"")}"></label>
    <label class="field">תיאור<input data-co="${i}" data-f="d" value="${esc(c.d||"")}"></label>
    <label class="field">קישור<input data-co="${i}" data-f="url" value="${esc(c.url||"")}" dir="ltr" placeholder="https://"></label>
    <button class="rm" type="button" data-codel="${i}" aria-label="מחיקת שיתוף הפעולה">×</button></div>`).join("")||'<p class="hint">עוד אין שיתופי פעולה. הכפתור לפנייה בוואטסאפ מופיע בדף תמיד.</p>';
}
async function shrink(file){
  try{const bmp=await createImageBitmap(file);const k=Math.min(1,1100/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),"image/jpeg",0.8));}catch(e){return file}
}
async function uploadFiles(files,onDone){
  const files2=[...files];let ok=0;
  for(let i=0;i<files2.length;i++){
    $("ed-msg").textContent=`מכינה תמונה ${i+1} מתוך ${files2.length}…`;
    try{const b=await shrink(files2[i]);
      if(b.size>450000){$("ed-msg").textContent="התמונה גדולה מדי. נסי תמונה קטנה יותר.";return}
      const url=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)});
      onDone(url);ok++}
    catch(err){$("ed-msg").textContent="לא הצלחתי לקרוא את התמונה. נסי JPG או PNG.";return}
  }
  $("ed-msg").textContent=ok?`נוספו ${ok} תמונות. לחצי "שמירה" כדי שיופיעו בדף.`:"";
}
function edMediaBind(){
  ["people","products"].forEach(k=>$("up-"+k).addEventListener("change",async e=>{const f=e.target.files;if(!f.length)return;await uploadFiles(f,id=>{draft[k].push({id,cap:""});edThumbs(k)});e.target.value=""}));
  $("ed-addco").addEventListener("click",()=>{draft.collabs.push({n:"",d:"",url:"",img:""});edCollabs()});
  $("ed").addEventListener("input",e=>{const t=e.target;
    if(t.dataset.g){draft[t.dataset.g][+t.dataset.gi].cap=t.value}
    if(t.dataset.co!==undefined&&t.dataset.f){draft.collabs[+t.dataset.co][t.dataset.f]=t.value}});
  $("ed").addEventListener("change",async e=>{const t=e.target;if(t.dataset.coimg===undefined||!t.files.length)return;const i=+t.dataset.coimg;await uploadFiles([t.files[0]],id=>{draft.collabs[i].img=id;edCollabs()})});
  $("ed").addEventListener("click",e=>{
    const g=e.target.closest("[data-gdel]");if(g){const[k,i]=g.dataset.gdel.split(":");draft[k].splice(+i,1);edThumbs(k);return}
    const c=e.target.closest("[data-codel]");if(c){draft.collabs.splice(+c.dataset.codel,1);edCollabs()}});
}

function edPosts(){
  $("ed-posts").innerHTML=(draft.posts||[]).map((p,i)=>`<details class="ed-sup"${p._open?" open":""}><summary><b>${esc(p.t||p.b?.slice(0,40)||"פריט חדש")}</b><span class="hint">${(PSECS.find(x=>x[0]===p.sec)||["",""])[1]}</span></summary>
    <div class="ed-grid">
      <label class="field">אזור בדף<select data-po="${i}" data-f="sec">${PSECS.map(([k,t])=>`<option value="${k}"${p.sec===k?" selected":""}>${t}</option>`).join("")}</select></label>
      <label class="field">כותרת<input data-po="${i}" data-f="t" value="${esc(p.t||"")}"></label>
      <label class="field wide">טקסט<textarea data-po="${i}" data-f="b" rows="5">${esc(p.b||"")}</textarea></label>
      <label class="field">חתימה (בהמלצות: שם הלקוח)<input data-po="${i}" data-f="who" value="${esc(p.who||"")}"></label>
      <label class="field">קישור<input data-po="${i}" data-f="url" value="${esc(p.url||"")}" dir="ltr" placeholder="https://"></label>
      <div class="ed-co-img wide">${p.img?`<img src="${blob(p.img)}" alt="">`:""}<label class="linkbtn" for="up-po-${i}">${p.img?"החלפת תמונה":"הוספת תמונה"}<input id="up-po-${i}" type="file" accept="image/*" data-poimg="${i}" hidden></label>${p.img?` · <button class="linkbtn" type="button" data-poimgdel="${i}">הסרת תמונה</button>`:""}</div>
      <div class="wide ed-del"><button class="btn ghost" type="button" data-podel="${i}">מחיקת הפריט</button></div>
    </div></details>`).join("")||'<p class="hint">עוד אין פריטים.</p>';
}
function edPostsBind(){
  $("ed-addpost").addEventListener("click",()=>{draft.posts.unshift({sec:"news",t:"",b:"",who:"",url:"",img:"",_open:1});edPosts()});
  $("ed").addEventListener("input",e=>{const t=e.target;if(t.dataset.po===undefined)return;const p=draft.posts[+t.dataset.po];p[t.dataset.f]=t.value;
    if(t.dataset.f==="sec")p._open=1,edPosts();});
  $("ed").addEventListener("change",async e=>{const t=e.target;if(t.dataset.poimg===undefined||!t.files.length)return;const i=+t.dataset.poimg;await uploadFiles([t.files[0]],id=>{draft.posts[i].img=id;draft.posts[i]._open=1;edPosts()})});
  let arm=null;
  $("ed").addEventListener("click",e=>{
    const d=e.target.closest("[data-podel]");if(d){const i=+d.dataset.podel;if(arm!==i){arm=i;d.textContent="לחצי שוב כדי למחוק";d.classList.add("warn");setTimeout(()=>{arm=null},4000);return}arm=null;draft.posts.splice(i,1);edPosts();return}
    const r=e.target.closest("[data-poimgdel]");if(r){const i=+r.dataset.poimgdel;draft.posts[i].img="";draft.posts[i]._open=1;edPosts()}});
}
function edOpen(){draft=JSON.parse(JSON.stringify(DATA));draft.people=draft.people||[];draft.products=draft.products||[];draft.collabs=draft.collabs||[];draft.posts=(draft.posts||[]).map(p=>({...p,_open:0}));edPosts();edThumbs("people");edThumbs("products");edCollabs();edPoints();edSups(-1);$("ed-msg").textContent="";APPROVED=[];loadSubs();$("ed").hidden=false;document.body.style.overflow="hidden"}
function edClose(){$("ed").hidden=true;document.body.style.overflow=""}
function edBind(){
  $("ed-open").addEventListener("click",edOpen);
  $("ed-cancel").addEventListener("click",edClose);
  $("ed-addpt").addEventListener("click",()=>{draft.points.push({n:"",t:"",a:""});edPoints()});
  $("ed-note").addEventListener("input",e=>{draft.note=e.target.value});
  $("ed-addsup").addEventListener("click",()=>{draft.suppliers.unshift({h:"s"+Date.now().toString(36),n:"",c:"veg",o:1,d:"",k:"",url:"",cd:2,ct:"19:00",p:"",pl:"",ks:"",f:0});edSups(0)});
  $("ed").addEventListener("input",e=>{const t=e.target,f=t.dataset.f;if(!f)return;
    if(t.dataset.pt!==undefined){draft.points[+t.dataset.pt][f]=t.value;return}
    if(t.dataset.i===undefined)return;const s=draft.suppliers[+t.dataset.i];
    if(t.type==="checkbox")s[f]=t.checked?1:0;else if(f==="cd")s[f]=t.value===""?null:+t.value;else s[f]=t.value;
    if(["n","o","cd","ct"].includes(f)){const sm=t.closest("details").querySelector("summary");sm.querySelector("b").textContent=s.n||"ספק חדש";sm.querySelector(".dot").classList.toggle("on",!!s.o);sm.querySelector(".hint").textContent=s.o?(s.cd!==null?"יום "+DAYN[s.cd]+" "+(s.ct||""):"מגיע השבוע"):"לא מגיע השבוע"}});
  let delArm=null;
  $("ed").addEventListener("click",e=>{
    const rp=e.target.closest("[data-rmpt]");if(rp){draft.points.splice(+rp.dataset.rmpt,1);edPoints();return}
    const d=e.target.closest("[data-del]");if(d){const i=+d.dataset.del;
      if(delArm!==i){delArm=i;d.textContent="לחצי שוב כדי למחוק";d.classList.add("warn");setTimeout(()=>{if(delArm===i){delArm=null;d.textContent="מחיקת הספק";d.classList.remove("warn")}},4000);return}
      delArm=null;draft.suppliers.splice(i,1);edSups(-1)}
  });
  $("ed-save").addEventListener("click",async()=>{
    draft.collabs=(draft.collabs||[]).filter(c=>(c.n||"").trim());
    draft.posts=(draft.posts||[]).filter(p=>(p.t||"").trim()||(p.b||"").trim()||p.img).map(({_open,...p})=>p);
    const bad=draft.suppliers.find(s=>!s.n.trim()||!/^https?:\/\//.test(s.url||""));
    if(bad){$("ed-msg").textContent=`חסר שם או קישור תקין (שמתחיל ב-https) אצל "${bad.n||"ספק חדש"}"`;return}
    $("ed-save").disabled=true;$("ed-msg").textContent="שומרת…";
    try{draft.ver=Date.now();await set(ref(db,SITE),JSON.parse(JSON.stringify(draft)));APPROVED.forEach(id=>set(ref(db,SUBS+"/"+id),null));APPROVED=[];$("ed-msg").textContent="נשמר ✓ הלקוחות כבר רואים את השינוי.";$("ed-save").disabled=false;setTimeout(edClose,900)}
    catch(err){$("ed-msg").textContent="השמירה לא הצליחה. בדקי את החיבור ונסי שוב.";$("ed-save").disabled=false}
  });
}
edBind();edMediaBind();edPostsBind();
// ---- customer submissions ----
const SUBS="subs5";let SUBTYPE="review",APPROVED=[],SUBLIST={};
const SUBLBL={review:["שליחת המלצה","על איזה ספק או מוצר?","מה אהבתם?"],recipe:["שליחת מתכון","שם המתכון","המצרכים ואופן ההכנה"],photo:["שליחת תמונה לגלריה","כיתוב לתמונה (לא חובה)",""]};
function subType(t){SUBTYPE=t;document.querySelectorAll('input[name="sub-type"]').forEach(r=>r.checked=r.value===t);
  $("sub-h").textContent=SUBLBL[t][0];$("sub-t").placeholder=SUBLBL[t][1];$("sub-b-l").hidden=t==="photo";$("sub-b").placeholder=SUBLBL[t][2]}
document.addEventListener("click",e=>{const b=e.target.closest("[data-sub]");if(!b)return;
  subType(b.dataset.sub);$("sub-msg").textContent="";$("sub-send").disabled=false;if(me.name&&!$("sub-name").value)$("sub-name").value=me.name;
  $("sub").hidden=false;document.body.style.overflow="hidden"});
document.querySelectorAll('input[name="sub-type"]').forEach(r=>r.addEventListener("change",()=>subType(r.value)));
function subClose(){$("sub").hidden=true;document.body.style.overflow=""}
$("sub-x").addEventListener("click",subClose);$("sub").addEventListener("click",e=>{if(e.target.id==="sub")subClose()});
$("sub-form").addEventListener("submit",async e=>{e.preventDefault();
  const name=$("sub-name").value.trim(),t=$("sub-t").value.trim(),b=$("sub-b").value.trim(),f=$("sub-img").files[0];
  if(!name){$("sub-msg").textContent="נשמח לדעת מי שולח 🙂";return}
  if(SUBTYPE==="photo"&&!f){$("sub-msg").textContent="בחרו תמונה לשליחה";return}
  if(SUBTYPE!=="photo"&&!b){$("sub-msg").textContent="כתבו כמה מילים";return}
  $("sub-send").disabled=true;$("sub-msg").textContent="שולח…";
  let img="";
  if(f){try{const bl=await shrink(f);if(bl.size>600000)throw 0;img=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(bl)})}
    catch(err){$("sub-msg").textContent="לא הצלחנו לקרוא את התמונה. נסו תמונה אחרת.";$("sub-send").disabled=false;return}}
  const id="s"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  try{await set(ref(db,SUBS+"/"+id),{type:SUBTYPE,name,t,b,img,ts:Date.now(),cid:CID});
    $("sub-form").reset();$("sub-msg").textContent="תודה רבה! ❤️ ורד תעבור על זה ותפרסם בקרוב.";setTimeout(subClose,2200)}
  catch(err){$("sub-msg").textContent="השליחה לא הצליחה. בדקו את החיבור ונסו שוב.";$("sub-send").disabled=false}
});
function edSubs(){
  const L=Object.entries(SUBLIST).filter(([id])=>!APPROVED.includes(id)).sort((a,b)=>b[1].ts-a[1].ts);
  const T={review:"💬 המלצה",recipe:"🍳 מתכון",photo:"📸 תמונה"};
  $("ed-subs").innerHTML=L.length?L.map(([id,s])=>`<div class="ed-subi">${s.img?`<img src="${blob(s.img)}" alt="">`:""}<div><b>${T[s.type]||""} · ${esc(s.name||"")}</b>${s.t?`<div>${esc(s.t)}</div>`:""}${s.b?`<p>${esc(s.b).replace(/\n/g,"<br>")}</p>`:""}
    <div class="ed-subact">${s.type==="photo"?`<button class="btn go" type="button" data-subok="${id}" data-to="people">לגלריית האנשים</button><button class="btn go" type="button" data-subok="${id}" data-to="products">לגלריית המוצרים</button>`:`<button class="btn go" type="button" data-subok="${id}">אישור ופרסום</button>`}<button class="btn ghost" type="button" data-subdel="${id}">מחיקה</button></div></div></div>`).join("")
    :'<p class="hint">אין כרגע שליחות חדשות.</p>';
}
function loadSubs(){$("ed-subs").innerHTML='<p class="hint">טוען…</p>';get(ref(db,SUBS)).then(s=>{SUBLIST=s.val()||{};edSubs()}).catch(()=>{$("ed-subs").innerHTML='<p class="hint">לא הצלחתי לטעון.</p>'})}
$("ed").addEventListener("click",e=>{
  const ok=e.target.closest("[data-subok]");if(ok){const id=ok.dataset.subok,s=SUBLIST[id];if(!s)return;
    if(s.type==="photo"){const k=ok.dataset.to;draft[k].push({id:s.img,cap:s.t||""});edThumbs(k)}
    else{draft.posts.unshift({sec:s.type==="review"?"reviews":"recipes",t:s.t||"",b:s.b||"",who:s.name||"",url:"",img:s.img||"",_open:0});edPosts()}
    APPROVED.push(id);edSubs();$("ed-msg").textContent='אושר. לחצי "שמירה" כדי לפרסם.';return}
  const del=e.target.closest("[data-subdel]");if(del){const id=del.dataset.subdel;set(ref(db,SUBS+"/"+id),null).then(()=>{delete SUBLIST[id];edSubs()});}
});
function adminCheck(){if(/admin/.test(location.hash)){OWNER=true;$("ed-open").hidden=false;renderMedia()}}
adminCheck();window.addEventListener("hashchange",adminCheck);
</script>
